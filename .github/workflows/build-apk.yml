name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "sdk.dir=$ANDROID_HOME" >> local.properties || true
        ls -la "$ANDROID_HOME"
        yes | sdkmanager --licenses || true

    - name: 修复 Gradle wrapper 并赋予权限
      run: |
        chmod +x gradlew
        sed -i "s|DEFAULT_JVM_OPTS=.*|DEFAULT_JVM_OPTS='-Xmx2048m -Xms64m'|" gradlew
        cat gradlew | grep DEFAULT_JVM_OPTS

    - name: 构建 Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: 上传 APK
      uses: actions/upload-artifact@v5
      with:
        name: magic-lockscreen-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 创建 Release (仅在推送到主分支时)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: 魔术锁屏 v1.0.${{ github.run_number }}
        body: |
          ## 🎭 魔术锁屏应用

          ### 功能
          - 仿小米锁屏界面
          - 密码输入始终显示错误
          - 在桌面上显示输入的密码

          ### 使用方法
          1. 下载 `app-debug.apk`
          2. 传输到手机并安装
          3. 允许"安装未知来源"权限
          4. 启动应用开始使用

          ### 注意事项
          - 仅供娱乐和魔术表演使用
          - 在自己的设备上演示
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
